<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ground:#16201C; --panel:#1E2A25; --panel-2:#24322C; --line:#34453E;
  --sand:#F1E7D2; --muted:#AEB8AB; --camp:#6CC6A8; --wings:#F2914A; --sea:#121A17;
  --display:'Bricolage Grotesque','Segoe UI',Roboto,Arial,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);overflow:hidden;color:var(--sand);font-family:var(--body)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;padding:40px 48px;display:grid;grid-template-rows:168px 1fr;gap:24px}

/* top band */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:40px;align-items:center}
.clock{display:flex;flex-direction:column;gap:2px}
.time{font-family:var(--display);font-weight:800;font-size:132px;line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.date{font-size:30px;color:var(--muted);padding-left:4px}
.countdowns{display:flex;gap:16px;justify-content:center;align-items:stretch;min-width:0}
.cd{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 22px;display:flex;align-items:center;gap:16px;min-width:0;max-width:460px}
.cd-n{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:var(--sand);font-variant-numeric:tabular-nums}
.cd-t{display:flex;flex-direction:column;min-width:0}
.cd-unit{font-size:20px;color:var(--muted)}
.cd-name{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd.today .cd-n{color:var(--wings)}
.cd-empty{font-size:22px;color:var(--muted)}
.weather{display:flex;gap:28px;align-items:center}
.now{display:flex;align-items:center;gap:14px}
.now-t{font-family:var(--display);font-weight:700;font-size:84px;line-height:1}
.now-meta{display:flex;flex-direction:column;font-size:22px;color:var(--muted);gap:2px}
.now-meta b{color:var(--sand);font-size:24px}
.days{display:flex;gap:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;font-size:20px}
.day .d{color:var(--muted)}
.day .hi{font-weight:700;font-size:22px}
.day .lo{color:var(--muted)}
.wx{width:44px;height:44px;stroke:var(--sand);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.now .wx{width:76px;height:76px}

/* main grid */
.main{display:grid;grid-template-columns:1.32fr 1fr;gap:24px;min-height:0}
.right{display:grid;grid-template-rows:1fr 1fr;gap:24px;min-height:0}
.panel{position:relative;background:var(--panel);border-radius:22px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:18px 26px 14px}
.panel-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:36px;letter-spacing:-.5px}
.camp h2{color:var(--camp)} .wings h2{color:var(--wings)}
.stats{display:flex;gap:26px;font-size:22px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:32px;color:var(--sand);margin-right:6px;font-weight:700}
.map{flex:1;min-height:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--body)}
.camp .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.4)}
.leaflet-control-attribution{background:rgba(22,32,28,.75)!important;color:#8E998C!important;font-size:11px}
.leaflet-control-attribution a{color:#B9C3B6!important}

/* spotlight card */
.spot{flex:none;margin:14px 18px 18px;background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:14px 22px;transition:opacity .6s ease;overflow:hidden}
.camp .spot{height:122px}
.spot.hide{opacity:0}
.spot .s-title{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1}
.spot .s-meta{font-size:22px;color:var(--muted);margin-top:6px;display:flex;gap:18px;flex-wrap:wrap}
.spot .s-notes{font-size:21px;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--wings);letter-spacing:2px}
.camp .stars{color:var(--camp)}
.wings .spot{display:flex;align-items:baseline;gap:20px;padding:12px 20px;height:62px;margin-top:12px}
.wings .spot .s-title{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wings .spot .s-meta{margin-top:0;flex:none;flex-wrap:nowrap}
.map{cursor:grab}

/* camp markers */
.pin{width:22px;height:22px;border-radius:50%;background:var(--camp);border:3px solid #0F1714;box-shadow:0 0 0 2px var(--camp)}
.pin.active{background:var(--sand);box-shadow:0 0 0 3px var(--camp),0 0 0 14px rgba(108,198,166,.28)}
.pin.home{background:var(--sand);box-shadow:0 0 0 2px var(--sand);width:16px;height:16px;border-width:3px}

/* photos */
.photos{background:#0E1412}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.ph.show{opacity:1}
.ph-cap{position:absolute;left:0;right:0;bottom:0;padding:40px 26px 18px;font-size:24px;background:linear-gradient(transparent,rgba(10,14,12,.85));z-index:2}
.ph-cap:empty{display:none}

.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:24px;line-height:1.4;color:var(--muted);z-index:500;pointer-events:none}
.empty b{color:var(--sand)}
.empty[hidden]{display:none}
.empty p{margin:0;max-width:560px}
.status{position:fixed;right:14px;bottom:10px;font-size:14px;color:#7F8A7E;z-index:1000;font-family:var(--body)}
.status.warn{color:var(--wings)}
.banner{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--wings);color:#1A120B;font-weight:700;font-size:18px;padding:6px 16px;border-radius:999px;z-index:900;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.ph,.spot{transition:none}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <header class="top">
    <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    <div class="countdowns" id="countdowns"></div>
    <div class="weather" id="weather"></div>
  </header>
  <main class="main">
    <section class="panel camp" aria-label="Camping map">
      <div class="panel-head"><h2>Where we’ve camped</h2><div class="stats" id="campStats"></div></div>
      <div class="map" id="campMap"></div>
      <div class="spot hide" id="campSpot"></div>
      <div class="empty" id="campEmpty" hidden></div>
    </section>
    <div class="right">
      <section class="panel wings" aria-label="Chicken wings world map">
        <div class="panel-head"><h2>Wings around the world</h2><div class="stats" id="wingStats"></div></div>
        <div class="map" id="wingMap"></div>
        <div class="spot hide" id="wingSpot"></div>
        <div class="empty" id="wingEmpty" hidden></div>
      </section>
      <section class="panel photos" aria-label="Photo slideshow" id="photoPanel">
        <img class="ph" id="phA" alt="">
        <img class="ph" id="phB" alt="">
        <div class="ph-cap" id="phCap"></div>
        <div class="empty" id="photoEmpty" hidden></div>
      </section>
    </div>
  </main>
  <div id="banner" class="banner" hidden></div>
</div></div>
<div class="status" id="status"></div>

/* ---------- dates ---------- */
function parseDate(v){
  if(!v) return null; v=String(v).trim();
  let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]); // SA style dd/mm/yyyy
  const d=new Date(v); return isNaN(d)?null:d;
}
const fmtDate = d => d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const stars = r => { const n=Math.max(0,Math.min(5,Math.round(parseFloat(r)||0))); return n? "★".repeat(n)+"☆".repeat(5-n) : ""; };

function wxKind(c){ if(c===0) return "sun"; if(c<=2) return "part"; if(c===3) return "cloud"; if(c<=48) return "fog";
  if(c>=95) return "storm"; if((c>=71&&c<=77)||c===85||c===86) return "snow"; return "rain"; }
const WXNAME={sun:"Clear",part:"Partly cloudy",cloud:"Cloudy",fog:"Fog",rain:"Rain",storm:"Thunderstorms",snow:"Snow"};
const svg = k => `<svg class="wx" viewBox="0 0 48 48" aria-hidden="true">${ICON[k]}</svg>`;
async function loadWeather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.HOME.lat}&longitude=${CONFIG.HOME.lng}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`;
    const w=await (await fetch(u)).json();
    const k=wxKind(w.current.weather_code);
    let days="";
    for(let i=1;i<5;i++){
      const d=new Date(w.daily.time[i]+"T12:00");
      days+=`<div class="day"><span class="d">${d.toLocaleDateString("en-GB",{weekday:"short"})}</span>${svg(wxKind(w.daily.weather_code[i]))}<span class="hi">${Math.round(w.daily.temperature_2m_max[i])}°</span><span class="lo">${Math.round(w.daily.temperature_2m_min[i])}°</span></div>`;
    }
    $("weather").innerHTML=`<div class="now">${svg(k)}<div class="now-t">${Math.round(w.current.temperature_2m)}°</div>
      <div class="now-meta"><b>${WXNAME[k]}</b><span>${CONFIG.HOME.name}</span><span>Wind ${Math.round(w.current.wind_speed_10m)} km/h</span><span>Rain ${w.daily.precipitation_probability_max[0]??0}%</span></div></div>
      <div class="days">${days}</div>`;
  }catch(e){ console.warn("weather",e); }
}

/* ---------- Google Sheet ---------- */
function rowsFromCsv(text){
  const p=Papa.parse(text,{header:true,skipEmptyLines:true,transformHeader:h=>norm(h)});
  return p.data.filter(r=>Object.values(r).some(v=>String(v).trim()!==""));
}
async function readTab(tab){
  const u=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&t=${Date.now()}`;
  const r=await fetch(u); if(!r.ok) throw new Error(tab+" "+r.status);
  const t=await r.text(); if(t.trim().startsWith("<")) throw new Error(tab+" is not shared publicly");
  return rowsFromCsv(t);
}
let DATA=null;
async function loadData(){
  if(!CONFIG.SHEET_ID){
    $("banner").hidden=false; $("banner").textContent="Showing example data – add your Google Sheet ID in the settings";
    return EXAMPLE;
  }
  const T=CONFIG.TABS;
  const [camps,wings,photos,countdowns]=await Promise.all([T.camps,T.wings,T.photos,T.countdowns].map(t=>readTab(t).catch(e=>{console.warn(e);return null;})));
  const failed=[camps,wings,photos,countdowns].some(x=>x===null);
  const prev=DATA||{camps:[],wings:[],photos:[],countdowns:[]};
  setStatus(failed? "Some Sheet tabs couldn’t be read – check tab names and sharing":"", failed);
  return { camps:camps??prev.camps, wings:wings??prev.wings, photos:photos??prev.photos, countdowns:countdowns??prev.countdowns };
}
function setStatus(msg,warn){
  const t=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  $("status").textContent=(msg?msg+" · ":"")+"Updated "+t; $("status").className="status"+(warn?" warn":"");
}

/* ---------- countdowns ---------- */
function renderCountdowns(rows){
  const today=new Date(); today.setHours(0,0,0,0);
  const list=rows.map(r=>({name:r.event||r.name||r.what||"",d:parseDate(r.date)})).filter(x=>x.name&&x.d)
    .map(x=>({...x,days:Math.round((x.d-today)/864e5)})).filter(x=>x.days>=0).sort((a,b)=>a.days-b.days).slice(0,3);
  $("countdowns").innerHTML= list.length ? list.map(x=>`<div class="cd${x.days===0?" today":""}"><div class="cd-n">${x.days===0?"Today":x.days}</div>
    <div class="cd-t">${x.days===0?"":`<span class="cd-unit">${x.days===1?"day to":"days to"}</span>`}<span class="cd-name">${esc(x.name)}</span></div></div>`).join("")
    : `<div class="cd-empty">Add dates to the Countdowns tab to see them here</div>`;
}

/* ---------- camping map ---------- */
const campMap=L.map("campMap",{zoomControl:false,attributionControl:true,dragging:true,scrollWheelZoom:true,wheelPxPerZoomLevel:90,doubleClickZoom:true,boxZoom:false,keyboard:false,touchZoom:true,zoomSnap:0.25,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,attribution:'&copy; OpenStreetMap contributors'}).addTo(campMap);
const SA_BOUNDS=L.latLngBounds([-35.2,13.5],[-15.6,36]);
campMap.fitBounds(SA_BOUNDS);
// If someone zooms or drags a map, leave it where they put it for 10 minutes before resetting
const touched={camp:0,wing:0};
function watch(map,key){ ["wheel","mousedown","touchstart","dblclick"].forEach(ev=>map.getContainer().addEventListener(ev,()=>touched[key]=Date.now(),{passive:true})); }
const idle=key=>Date.now()-touched[key]>10*60e3;
watch(campMap,"camp");
L.marker([CONFIG.HOME.lat,CONFIG.HOME.lng],{icon:L.divIcon({className:"",html:'<div class="pin home"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(campMap);
let campLayer=L.layerGroup().addTo(campMap), camps=[], campIdx=-1;
function parseLoc(r){
  let lat=parseFloat(r.lat||r.latitude), lng=parseFloat(r.lng||r.lon||r.long||r.longitude);
  if(isNaN(lat)||isNaN(lng)){ const m=String(r.location||r.coordinates||r.gps||"").match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/); if(m){lat=+m[1];lng=+m[2];} }
  return (isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180)?null:[lat,lng];
}
function renderCamps(rows){
  campLayer.clearLayers();
  camps=rows.map(r=>({name:r.name||r.campsite||r.place||"Campsite",d:parseDate(r.date),ll:parseLoc(r),nights:parseInt(r.nights)||0,rating:r.rating,notes:r.notes||""}))
    .filter(c=>c.ll).sort((a,b)=>(a.d||0)-(b.d||0));
  camps.forEach(c=>{ c.el=L.marker(c.ll,{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false}).addTo(campLayer); });
  const bounds=L.latLngBounds(SA_BOUNDS.getSouthWest(),SA_BOUNDS.getNorthEast()); camps.forEach(c=>bounds.extend(c.ll));
  campMap.invalidateSize(); if(idle("camp")) campMap.fitBounds(bounds,{padding:[30,30]});
  const nights=camps.reduce((s,c)=>s+c.nights,0);
  $("campStats").innerHTML=`<span><b>${camps.length}</b>${camps.length===1?"campsite":"campsites"}</span><span><b>${nights}</b>${nights===1?"night":"nights"} out</span>`;
  $("campEmpty").hidden=camps.length>0;
  $("campEmpty").innerHTML="<p>No campsites yet. Add a row to the <b>Campsites</b> tab with a name, date and location.</p>";
  campIdx=-1; spotCamp();
}
function spotCamp(){
  const card=$("campSpot");
  if(!camps.length){card.classList.add("hide");return;}
  camps.forEach(c=>c.el.getElement()?.firstChild?.classList.remove("active"));
  campIdx=(campIdx+1)%camps.length; const c=camps[campIdx];
  c.el.getElement()?.firstChild?.classList.add("active");
  card.classList.add("hide");
  setTimeout(()=>{
    card.innerHTML=`<div class="s-title">${esc(c.name)}</div><div class="s-meta">${c.d?`<span>${fmtDate(c.d)}</span>`:""}${c.nights?`<span>${c.nights} ${c.nights===1?"night":"nights"}</span>`:""}${stars(c.rating)?`<span class="stars">${stars(c.rating)}</span>`:""}</div>${c.notes?`<div class="s-notes">${esc(c.notes)}</div>`:""}`;
    card.classList.remove("hide");
  },450);
}

/* ---------- wings world map ---------- */
const wingMap=L.map("wingMap",{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:true,wheelPxPerZoomLevel:90,doubleClickZoom:true,boxZoom:false,keyboard:false,touchZoom:true,zoomSnap:0.1,worldCopyJump:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
const byKey={}; WORLD.features.forEach(f=>{ const p=f.properties; [p.n,...p.a,p.i3,p.i2].forEach(k=>{ if(k&&k!=="-99") byKey[norm(k)]=f; }); });
function findCountry(name){
  const k=norm(name); if(!k) return null;
  if(ALIAS[k]) return {f:WORLD.features.find(f=>f.properties.i3===ALIAS[k])};
  if(byKey[k]) return {f:byKey[k]};
  if(SMALL[k]) return {small:SMALL[k],label:name};
  const hit=WORLD.features.find(f=>norm(f.properties.n).startsWith(k)||k.startsWith(norm(f.properties.n)));
  return hit?{f:hit}:null;
}
let worldLayer=L.geoJSON(WORLD,{style:()=>({color:"#3A4A43",weight:1,fillColor:"#2C3A34",fillOpacity:1}),interactive:false}).addTo(wingMap);
let smallLayer=L.layerGroup().addTo(wingMap);
const WORLD_BOUNDS=[[-50,-165],[75,175]];
wingMap.fitBounds(WORLD_BOUNDS);
watch(wingMap,"wing");
let wings=[], wingIdx=-1, counts={};
function shade(i3,active){
  const n=counts[i3]||0;
  if(!n) return {color:"#3A4A43",weight:1,fillColor:"#2C3A34",fillOpacity:1};
  const op=Math.min(1,.55+.15*n);
  return {color:active?"#FFF2E0":"#7A4A27",weight:active?2.5:1,fillColor:"#F2914A",fillOpacity:active?1:op};
}
function renderWings(rows){
  counts={}; smallLayer.clearLayers(); const missing=[];
  wings=rows.map(r=>({country:r.country||"",recipe:r.recipe||r.name||r.wings||"Wings",d:parseDate(r.date),rating:r.rating,notes:r.notes||""})).filter(w=>w.country);
  wings.forEach(w=>{ const m=findCountry(w.country); w.m=m; if(!m){missing.push(w.country);return;}
    if(m.f) counts[m.f.properties.i3]=(counts[m.f.properties.i3]||0)+1;
    else L.circleMarker(m.small,{radius:7,color:"#FFF2E0",weight:2,fillColor:"#F2914A",fillOpacity:1,interactive:false}).addTo(smallLayer); });
  worldLayer.setStyle(f=>shade(f.properties.i3,false));
  wingMap.invalidateSize(); if(idle("wing")) wingMap.fitBounds(WORLD_BOUNDS);
  const countries=new Set(wings.filter(w=>w.m).map(w=>w.m.f?w.m.f.properties.i3:norm(w.country))).size;
  const rated=wings.map(w=>parseFloat(w.rating)).filter(x=>!isNaN(x));
  $("wingStats").innerHTML=`<span><b>${countries}</b>${countries===1?"country":"countries"}</span><span><b>${wings.length}</b>${wings.length===1?"recipe":"recipes"}</span>`;
  $("wingEmpty").hidden=wings.length>0;
  $("wingEmpty").innerHTML="<p>No wings logged yet. Add a row to the <b>Wings</b> tab with the country and recipe.</p>";
  if(missing.length) setStatus("Couldn’t place on the world map: "+[...new Set(missing)].join(", "),true);
  wingIdx=-1; spotWing();
}
function spotWing(){
  const card=$("wingSpot");
  if(!wings.length){card.classList.add("hide");return;}
  wingIdx=(wingIdx+1)%wings.length; const w=wings[wingIdx];
  worldLayer.setStyle(f=>shade(f.properties.i3, w.m&&w.m.f===f));
  card.classList.add("hide");
  setTimeout(()=>{
    card.innerHTML=`<div class="s-title">${esc(w.recipe)}</div><div class="s-meta"><span>${esc(w.country)}</span>${w.d?`<span>${fmtDate(w.d)}</span>`:""}${stars(w.rating)?`<span class="stars">${stars(w.rating)}</span>`:""}</div>`;
    card.classList.remove("hide");
  },450);
}

/* ---------- photos ---------- */
let photos=[], phIdx=-1, phFront="phA";
function photoUrl(link){
  const s=String(link||"").trim(); if(!s) return null;
  const m=s.match(/\/d\/([\w-]{20,})/)||s.match(/[?&]id=([\w-]{20,})/);
  if(m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`;
  return /^https?:\/\//.test(s)?s:null;
}
function renderPhotos(rows){
  const next=rows.map(r=>({src:photoUrl(r.link||r.url||r.photo),cap:r.caption||""})).filter(p=>p.src);
  const changed=JSON.stringify(next.map(p=>p.src))!==JSON.stringify(photos.map(p=>p.src));
  photos=next;
  $("photoEmpty").hidden=photos.length>0;
  $("photoEmpty").innerHTML="<p>No photos yet. Paste Google Drive photo links into the <b>Photos</b> tab.</p>";
  if(!photos.length){ $("phA").classList.remove("show"); $("phB").classList.remove("show"); $("phCap").textContent=""; }
  else if(changed||phIdx<0){ phIdx=-1; nextPhoto(); }
}
function nextPhoto(){
  if(!photos.length) return;
  phIdx=(phIdx+1)%photos.length;
  // shuffle-ish order on each full loop
  const p=photos[phIdx], back=phFront==="phA"?"phB":"phA", img=$(back);
  img.onload=()=>{ $(back).classList.add("show"); $(phFront).classList.remove("show"); phFront=back; $("phCap").textContent=p.cap; };
  img.onerror=()=>{ console.warn("photo failed",p.src); };
  img.src=p.src;
}

/* ---------- run ---------- */
async function refresh(){
  try{
    DATA=await loadData();
    renderCountdowns(DATA.countdowns); renderCamps(DATA.camps); renderWings(DATA.wings); renderPhotos(DATA.photos);
    if(CONFIG.SHEET_ID && !$("status").classList.contains("warn")) setStatus("",false);
  }catch(e){ console.error(e); setStatus("Couldn’t reach the Google Sheet – showing the last data",true); }
}
setTimeout(()=>{campMap.invalidateSize();wingMap.invalidateSize();},300);
document.fonts?.ready.then(()=>{ campMap.invalidateSize(); wingMap.invalidateSize(); wingMap.fitBounds(WORLD_BOUNDS); });
refresh(); loadWeather();
setInterval(refresh, CONFIG.REFRESH_MINUTES*60e3);
setInterval(loadWeather, 30*60e3);
setInterval(spotCamp, CONFIG.SPOTLIGHT_SECONDS*1e3);
setTimeout(()=>setInterval(spotWing, CONFIG.SPOTLIGHT_SECONDS*1e3), CONFIG.SPOTLIGHT_SECONDS*500);
setInterval(nextPhoto, CONFIG.PHOTO_SECONDS*1e3);
setTimeout(()=>location.reload(), CONFIG.RELOAD_HOURS*3600e3);

</script>
</body>
